<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Um Girassol para Você 🌻</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="main-wrapper d-flex justify-content-center align-items-center min-vh-100 p-3">
        
        <!-- Contêiner de Perspectiva 3D -->
        <div class="card-container" id="card-trigger">
            <div class="card-3d" id="card-object">
                
                <!-- CAPA DO CARTÃO (Apenas o Girassol e o Botão) -->
                <div class="card-face card-front shadow-lg">
                    <div class="card-body text-center d-flex flex-column justify-content-center align-items-center p-4">
                        <div class="sunflower-icon-large animate-float mb-4">🌻</div>
                        
                        <button class="btn btn-open-card rounded-pill px-4 py-2 shadow-sm font-cute">
                            Para você
                        </button>
                    </div>
                </div>

                <!-- CONTEÚDO INTERNO DO CARTÃO -->
                <div class="card-face card-inside shadow-lg">
                    <div class="card-body text-center p-3 p-md-4 d-flex flex-column justify-content-between">
                        
                        <div>
                            <span class="sunflower-small">🌻</span>
                            
                            <!-- Frase Personalizada -->
                            <p class="custom-phrase my-3 text-secondary">
                                "Tudo tem o seu devido tempo e momento, quando tivermos esse tempo para nós, darei a você aquele abraço demorado e toda minha atenção, amor e carinho."
                            </p>
                        </div>

                        <div class="invitation-box p-3 rounded-4 my-2">
                            <h3 class="h6 text-dark font-cute mb-1">Nosso Encontro 💛</h3>
                            <p class="mb-0 text-secondary small fw-semibold">📍 Local: A definir</p>
                            <p class="mb-0 text-secondary small fw-semibold">📅 Data: 20 de Setembro às 15:00</p>
                        </div>

                        <!-- Cronômetro -->
                        <div>
                            <div class="row g-1 justify-content-center mb-2" id="countdown">
                                <div class="col-3">
                                    <div class="timer-unit p-1 rounded-3">
                                        <span id="days" class="d-block h5 mb-0 fw-bold">00</span>
                                        <small class="text-muted tiny-text">dias</small>
                                    </div>
                                </div>
                                <div class="col-3">
                                    <div class="timer-unit p-1 rounded-3">
                                        <span id="hours" class="d-block h5 mb-0 fw-bold">00</span>
                                        <small class="text-muted tiny-text">horas</small>
                                    </div>
                                </div>
                                <div class="col-3">
                                    <div class="timer-unit p-1 rounded-3">
                                        <span id="minutes" class="d-block h5 mb-0 fw-bold">00</span>
                                        <small class="text-muted tiny-text">min</small>
                                    </div>
                                </div>
                                <div class="col-3">
                                    <div class="timer-unit p-1 rounded-3">
                                        <span id="seconds" class="d-block h5 mb-0 fw-bold">00</span>
                                        <small class="text-muted tiny-text">seg</small>
                                    </div>
                                </div>
                            </div>

                            <p class="footer-note font-cute mb-0">Com amor Caue ✨</p>
                        </div>

                    </div>
                </div>

            </div>
        </div>

    </div>

    <!-- Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
